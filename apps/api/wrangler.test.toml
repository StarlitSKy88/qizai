# Test-only wrangler config. Mirrors wrangler.toml but isolates the JWT secret
# so integration tests never accidentally sign tokens with the dev secret.
name = "qizai-api"
main = "src/index.ts"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALIBABA_BAILIAN_MODEL = "qwen3.5-flash"
FIREWORKS_MODEL = "qwen3p7-plus"
DEEPSEEK_MODEL = "deepseek-v4-flash"
JWT_SECRET = "test-secret-isolated-from-dev"
NODE_ENV = "test"
# WeChat Pay V3 test creds (fake — fetch stubbed, see checkout.test.ts).
# Real values injected via `wrangler secret put WXPAY_*` in production.
WXPAY_MCH_ID = "1900000001"
WXPAY_API_KEY_V3 = "00000000000000000000000000000000"
WXPAY_PRIVATE_KEY = '-----BEGIN PRIVATE KEY----- TEST -----END PRIVATE KEY-----'
WXPAY_PLATFORM_CERT = '-----BEGIN CERTIFICATE----- TEST -----END CERTIFICATE-----'
WXPAY_CERT_SERIAL = "TEST_SERIAL_0001"
WXPAY_NOTIFY_URL = "https://api.qizai.app/api/checkout/callback"
WXPAY_USE_SANDBOX = "true"

[[d1_databases]]
binding = "DB"
database_name = "qizai-db"
database_id = "local-dev-placeholder"
